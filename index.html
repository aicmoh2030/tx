const store=(()=>{
  let ok=false;const mem={};
  try{const k='__probe__';window.localStorage.setItem(k,'1');window.localStorage.removeItem(k);ok=true}catch(e){ok=false}
  return {
    ok,
    getItem(k){if(ok){try{return window.localStorage.getItem(k)}catch(e){}}return Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:null},
    setItem(k,v){if(ok){try{window.localStorage.setItem(k,v);return}catch(e){}}mem[k]=String(v)},
    removeItem(k){if(ok){try{window.localStorage.removeItem(k)}catch(e){}}delete mem[k]}
  };
})();

function hexRgb(h){h=String(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255]}
const rgba=(h,a)=>{const [r,g,b]=hexRgb(h);return `rgba(${r},${g},${b},${a})`};

const lum=h=>{const [r,g,b]=hexRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};

/* SHA-256 مضمّن (يعمل حتى عند فتح الملف محليًا) — لتخزين بصمة الرقم السري لا الرقم نفسه */
function sha256(str){
  const rr=(v,a)=>(v>>>a)|(v<<(32-a));
  const isP=x=>{for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true};
  const frac=x=>((x-Math.floor(x))*4294967296)|0;
  const K=[],H=[];let n=2,c=0;
  while(c<64){if(isP(n)){if(c<8)H[c]=frac(Math.pow(n,1/2));K[c]=frac(Math.pow(n,1/3));c++}n++}
  const bytes=new TextEncoder().encode(str),l=bytes.length,bl=((l+9+63)>>6)<<6;
  const m=new Uint8Array(bl);m.set(bytes);m[l]=0x80;
  const dv=new DataView(m.buffer);dv.setUint32(bl-8,Math.floor(l*8/4294967296));dv.setUint32(bl-4,(l*8)>>>0);
  const w=new Int32Array(64);
  for(let o=0;o<bl;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getInt32(o+i*4);
    for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2];w[i]=(w[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+w[i-7]+(rr(b,17)^rr(b,19)^(b>>>10)))|0}
    let a=H[0],b=H[1],c2=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let i=0;i<64;i++){
      const t1=(h+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0;
      const t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b)^(a&c2)^(b&c2)))|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c2;c2=b;b=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c2)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}

  if(col==='_due')return isDue(t)?`<span class="badge" style="background:var(--red-bg);color:var(--red)">${esc(T('due.badgeDue'))}</span>`:(isFollow(t)&&isOpen(t)?`<span class="badge" style="background:${rgba(cfg.theme.amber,.14)};color:var(--amber)">${esc(T('due.badgeSoon'))}${t.reminderDate?' · '+daysLeft(t.reminderDate):''}</span>`:'—');
  if(col==='_updated')return fmt(t.updated);
  if(col==='_closed')return fmt(t.closed);
  if(col==='_created')return fmt(t.created?new Date(t.created).toISOString().slice(0,10):'');
  const f=fieldOf(col); if(!f)return '';
  const v=getVal(t,f);
  if(f.type==='status')return badge(t.status);
  if(f.type==='date')return v?fmt(v):'—';
  if(f.id==='number')return `<strong>${esc(v)}</strong>`;
  if(f.type==='checkbox')return v?'نعم':'لا';
  if(f.type==='textarea'){const s=String(v||'');return esc(s.length>60?s.slice(0,60)+'…':s)||'—'}
  return esc(v)||'—';
}

function applyTheme(){
  const th=cfg.theme, r=document.documentElement.style;
  ['navy','gold','bg','paper','ink','muted','line','blue','green','red','amber','orange'].forEach(k=>r.setProperty('--'+k,th[k]));
  const dark=lum(th.paper)<.35;
  r.setProperty('--navy-fg',readable(th.navy));
  r.setProperty('--gold-fg',readable(th.gold));
  r.setProperty('--head',dark?th.ink:th.navy);
  r.setProperty('--navy2',dark?mix(th.gold,'#ffffff',.2):mix(th.navy,'#ffffff',.2));
  r.setProperty('--surface',dark?mix(th.paper,'#ffffff',.05):mix(th.paper,th.ink,.02));
  r.setProperty('--green-bg',rgba(th.green,.14));
  r.setProperty('--red-bg',rgba(th.red,.13));
  r.setProperty('--r',(th.radius||14)+'px');
  r.setProperty('--fs',(16*(th.fontScale||100)/100)+'px');
  document.body.style.fontFamily=`${th.font||'Tahoma'},Tahoma,"Segoe UI",Arial,sans-serif`;
  const m=document.querySelector('meta[name=theme-color]'); if(m)m.content=th.navy;
}

function edField(fl,vals){
  const v=vals[fl.k]??fl.def??'';
  const lab=`<label>${esc(fl.label)}${fl.req?' *':''}</label>`, help=fl.help?`<small>${esc(fl.help)}</small>`:'';
  const k=`data-k="${fl.k}"`;
  switch(fl.type){
    case 'textarea':return `<div class="field" style="margin-bottom:.8rem">${lab}<textarea ${k}>${esc(v)}</textarea>${help}</div>`;
    case 'number':return `<div class="field" style="margin-bottom:.8rem">${lab}<input type="number" ${k} value="${esc(v)}" ${fl.min!=null?`min="${fl.min}"`:''} ${fl.max!=null?`max="${fl.max}"`:''}>${help}</div>`;
    case 'color':return `<div class="field" style="margin-bottom:.8rem">${lab}<input type="color" ${k} value="${esc(v||'#888888')}" style="height:2.6rem;padding:.15rem">${help}</div>`;
    case 'check':return `<div class="field" style="margin-bottom:.8rem"><label style="display:flex;gap:.5rem;align-items:center;font-weight:700"><input type="checkbox" ${k} ${v?'checked':''}> ${esc(fl.label)}</label>${help}</div>`;
    case 'select':return `<div class="field" style="margin-bottom:.8rem">${lab}<select ${k}>${fl.opts.map(o=>`<option value="${esc(o[0])}"${String(o[0])===String(v)?' selected':''}>${esc(o[1])}</option>`).join('')}</select>${help}</div>`;
    case 'multi':{const sel=Array.isArray(v)?v:[];return `<div class="field" style="margin-bottom:.8rem">${lab}<div class="checks" data-multi="${fl.k}">${fl.opts.map(o=>`<label><input type="checkbox" value="${esc(o[0])}"${sel.includes(o[0])?' checked':''}> ${esc(o[1])}</label>`).join('')||'<small>لا توجد خيارات.</small>'}</div>${help}</div>`}
    case 'icon':return `<div class="field" style="margin-bottom:.8rem">${lab}<input ${k} value="${esc(v)}" list="iconList" maxlength="4" style="max-width:8rem">${help}</div>`;
    default:return `<div class="field" style="margin-bottom:.8rem">${lab}<input ${k} value="${esc(v)}" ${fl.ph?`placeholder="${esc(fl.ph)}"`:''}>${help}</div>`;
  }
}
function openEditor(spec){
  $('#edTitle').textContent=spec.title;
  const f=$('#edForm');
  f.innerHTML=(spec.intro?`<div class="notice">${esc(spec.intro)}</div>`:'')+spec.fields.map(fl=>edField(fl,spec.values||{})).join('')+
    `<datalist id="iconList">${ICONS.map(i=>`<option value="${i}">`).join('')}</datalist>`+
    `<div class="form-actions"><button class="btn primary" type="submit">${esc(spec.saveText||'حفظ')}</button><button class="btn secondary" type="button" data-close>إلغاء</button>${spec.onDelete?`<button class="btn danger" type="button" id="edDel" style="margin-inline-start:auto">${esc(spec.deleteText||'حذف')}</button>`:''}</div>`;
  f.onsubmit=e=>{
    e.preventDefault();
    const vals={};
    for(const fl of spec.fields){
      let v;
      if(fl.type==='multi')v=$$(`[data-multi="${fl.k}"] input:checked`,f).map(x=>x.value);
      else if(fl.type==='check')v=$(`[data-k="${fl.k}"]`,f).checked;
      else{v=$(`[data-k="${fl.k}"]`,f).value;if(fl.type==='number')v=v===''?null:Number(v);else if(typeof v==='string')v=v.trim()}
      if(fl.req&&(v===''||v==null||(Array.isArray(v)&&!v.length))){toast('أكمل الحقل المطلوب: '+fl.label);return}
      vals[fl.k]=v;
    }
    if(spec.onSave(vals)!==false)closeModals();
  };

}

function statNames(ids){return (ids||[]).map(id=>(cfg.statuses.find(s=>s.id===id)||{}).name).filter(Boolean)}
function metricCount(w){
  switch(w.metric){
    case 'total':return visTx().length;
    case 'status':{const n=statNames(w.statuses);return visTx().filter(t=>n.includes(t.status)).length}

function panelHead(w,title,desc){return `<div class="panel-head"><div><h2>${esc(title)}</h2>${desc?`<p>${esc(desc)}</p>`:''}</div>${w.link&&page(w.link)?`<button class="btn secondary" data-go="${esc(w.link)}">${esc(T('btn.viewAll'))}</button>`:''}</div>`}
function renderWidget(w){

function searchText(t){return norm(cfg.fields.map(f=>plain(t,f)).join(' '))}
const DATE_COLS=()=>[['received',fieldLabel('received')],['_updated',VIRTUAL._updated],['reminderDate',fieldLabel('reminderDate')],['_closed',VIRTUAL._closed],['_created',VIRTUAL._created],...cfg.fields.filter(f=>!f.builtin&&f.type==='date').map(f=>[f.id,f.label])];
function pageRows(p){
  const fl=p.filter||{};
  const names=statNames(fl.statuses);
  let rows=visTx().filter(t=>
    (!(fl.statuses||[]).length||names.includes(t.status))&&
    (!(fl.types||[]).length||fl.types.includes(t.type))&&
    (!(fl.owners||[]).length||fl.owners.includes(ownKey(t)))&&
    (!(fl.priorities||[]).length||fl.priorities.includes(t.priority))&&
    (!fl.dueOnly||isDue(t))&&
    (!fl.followOnly||(isFollow(t)&&isOpen(t))));
  const f=UI.filters[p.id]||{};
  const terms=norm(f.q||'').split(/\s+/).filter(Boolean), party=norm(f.party||''), df=f.df||'received';
  rows=rows.filter(t=>{
    if(terms.length){const hay=f.qf?norm(plain(t,f.qf)):searchText(t);if(!terms.every(w=>hay.includes(w)))return false}
    if(f.status&&t.status!==f.status)return false;
    if(f.type&&t.type!==f.type)return false;
    if(f.priority&&t.priority!==f.priority)return false;
    if(f.owner&&ownerOn()&&t.owner!==f.owner)return false;
    if(f.emp&&t.employee!==f.emp)return false;
    if(f.dept&&t.department!==f.dept)return false;
    if(party&&!norm(t.party).includes(party))return false;
    if(f.from||f.to){const d=String(plain(t,df)||'').slice(0,10);if(!d)return false;if(f.from&&d<f.from)return false;if(f.to&&d>f.to)return false}
    return true;
  });
  const s=UI.sort[p.id];
  if(s)rows=rows.sort((a,b)=>String(plain(a,s.col)).localeCompare(String(plain(b,s.col)),'ar',{numeric:true})*(s.dir==='desc'?-1:1));
  else if(fl.followOnly)rows=rows.sort((a,b)=>(a.reminderDate||'9999').localeCompare(b.reminderDate||'9999'));
  else rows=rows.sort((a,b)=>(b.created||0)-(a.created||0));
  return rows;
}

function selectHtml(a,opts,val,empty){
  const list=[...opts];if(val&&!list.includes(val))list.push(val);
  return `<select ${a}>${empty?'<option value=""></option>':''}${list.map(o=>`<option${o===val?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
}
function fieldInput(f,val){
  const a=`data-f="${esc(f.id)}" id="f_${esc(f.id)}"`+(f.required?' required':''), ph=f.ph?` placeholder="${esc(f.ph)}"`:'';
  switch(f.type){
    case 'textarea':return `<textarea ${a}${ph}>${esc(val)}</textarea>`;
    case 'date':return `<input type="date" ${a} value="${esc(val)}"><small data-dh style="color:var(--head);font-weight:700">${val?fmt(val):''}</small>`;
    case 'number':return `<input type="number" step="any" ${a}${ph} value="${esc(val)}">`;
    case 'checkbox':return `<input type="checkbox" data-f="${esc(f.id)}" id="f_${esc(f.id)}" ${val?'checked':''} style="width:1.3rem;height:1.3rem;min-height:0">`;
    case 'select':return selectHtml(a,listItems(f),val,true);
    case 'combo':return `<input ${a}${ph} value="${esc(val)}" list="dl_${esc(f.id)}" autocomplete="off"><datalist id="dl_${esc(f.id)}">${listItems(f).map(o=>`<option value="${esc(o)}"></option>`).join('')}</datalist>`;
    case 'type':return selectHtml(a,cfg.types,val,false);
    case 'priority':return selectHtml(a,cfg.priorities,val,false);
    case 'status':return selectHtml(a,cfg.statuses.map(s=>s.name),val,false);
    case 'follow':return selectHtml(a,FOLLOW_OPTS,val||FOLLOW_OPTS[0],false);
    default:return `<input ${a}${ph} value="${esc(val)}">`;
  }
}

/* الخط الزمني: الإدارة والموظف عند الإنشاء، وكل تحويل أو إسناد أو تغيير متابعة لاحقًا — في نفس سطر تغيير الحالة إن وُجد */
function logChanges(t,o){
  const fv=k=>{const f=cfg.fields.find(x=>x.id===k);return !!(f&&f.visible!==false)};
  const n=[];
  if(o.isNew){
    if(fv('department')&&t.department)n.push(fieldLabel('department')+': '+t.department);
    if(fv('employee')&&t.employee)n.push(fieldLabel('employee')+': '+t.employee);
    if(t.followup==='عليها متابعة')n.push('عليها متابعة'+(t.reminderDate?' — '+fieldLabel('reminderDate')+': '+fmt(t.reminderDate):''));
  }else{
    if(fv('department')&&(t.department||'')!==o.dept)n.push('تحويل '+fieldLabel('department')+': '+(o.dept||'—')+' ← '+(t.department||'—'));
    if(fv('employee')&&(t.employee||'')!==o.emp)n.push('إسناد '+fieldLabel('employee')+': '+(o.emp||'—')+' ← '+(t.employee||'—'));
    if((t.followup||'')!==o.follow&&o.follow!=='')n.push(fieldLabel('followup')+': '+(t.followup||'—'));
    else if(t.followup==='عليها متابعة'&&(t.reminderDate||'')!==o.deadline)n.push(fieldLabel('reminderDate')+': '+(t.reminderDate?fmt(t.reminderDate):'—'));
  }
  if(!n.length)return;
  if(t.history.length>o.hl)t.history[t.history.length-1][3]=n.join(' · ');else t.history.push([today(),t.status,me().name,n.join(' · ')]);
}
function applyStatusEffects(t,prev,isNew){
  if(isNew||prev!==t.status){t.history.push([today(),t.status,me().name]);const d=(st(t.status)||{}).dept;if(d)t.department=d}
  if(stRole(t)==='closed')t.closed=t.closed||today();else t.closed=null;
  t.updated=today();t.rev=Date.now();delete t.demo;
}
function saveForm(){
  const id=$('#editId').value;
  let t=id?transactions.find(x=>x.id===id):null;
  const vals={};
  for(const f of cfg.fields){
    const el=$(`#txForm [data-f="${f.id}"]`);if(!el)continue;
    const v=f.type==='checkbox'?el.checked:(el.value||'').trim();
    const hiddenCond=el.closest('[data-when]')&&el.closest('[data-when]').style.display==='none';
    if(f.required&&f.type!=='checkbox'&&!hiddenCond&&v===''){toast('أكمل الحقل: '+f.label);el.focus();return}
    vals[f.id]=v;
  }
  if(vals.followup==='عليها متابعة'&&('reminderDate' in vals)&&!vals.reminderDate){toast('حدّد '+fieldLabel('reminderDate')+' للمعاملة التي عليها متابعة');const e=$('#f_reminderDate');if(e)e.focus();return}
  const num=numKey(vals.number);
  if(transactions.some(x=>x.id!==(t&&t.id)&&numKey(x.number)===num))return toast(T('msg.dupNumber'));
  const isNew=!t;
  if(isNew){t={id:uid('t'),created:Date.now(),history:[],customFields:{},type:cfg.types[0]||'',department:cfg.brand.org,owner:ownerOn()?myEmp():'',priority:cfg.priorities[0]||'',status:defStatus(),received:today(),reminderOwner:myEmp()};transactions.unshift(t)}
  const prev=t.status,prevDept=t.department||'',prevEmp=t.employee||'',prevFollow=t.followup||'',prevDeadline=t.reminderDate||'';
  let listsChanged=false;
  cfg.fields.forEach(f=>{
    if(!(f.id in vals))return;
    if(f.builtin)t[f.id]=vals[f.id];else t.customFields[f.id]=vals[f.id];
    /* قيمة جديدة كُتبت في حقل قائمة: تُحفظ في القائمة لتظهر كخيار لاحقًا */
    if(f.type==='combo'&&vals[f.id]&&cfg.lists[f.list]&&!cfg.lists[f.list].items.includes(vals[f.id])){cfg.lists[f.list].items.push(vals[f.id]);listsChanged=true}
  });
  if(!t.topic)t.topic=nextTopic();
  const hl=(t.history||[]).length;
  applyStatusEffects(t,prev,isNew);
  logChanges(t,{dept:prevDept,emp:prevEmp,hl,isNew,follow:prevFollow,deadline:prevDeadline});
  persistTx();if(listsChanged)persistCfg(true);closeModals();refresh();toast(T('msg.saved'));
}

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
/* ملف ZIP بدون ضغط (يفتحه Excel مباشرة) */
function zipStore(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  files.forEach(f=>{
    const name=enc.encode(f.name),data=enc.encode(f.text),crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0x0021,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x0021,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,name.length,true);ch.setUint32(42,off,true);
    parts.push(new Uint8Array(lh.buffer),name,data);central.push(new Uint8Array(ch.buffer),name);
    off+=30+name.length+data.length;
  });
  let cs=0;central.forEach(p=>{cs+=p.length});
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
/* قراءة ZIP (مخزّن أو مضغوط deflate) */
async function zipRead(buf){
  const bytes=new Uint8Array(buf),dv=new DataView(buf);let eo=-1;
  for(let i=bytes.length-22;i>=0&&i>=bytes.length-22-65557;i--){if(dv.getUint32(i,true)===0x06054b50){eo=i;break}}
  if(eo<0)throw Error('الملف ليس ملف Excel صالحًا (xlsx)');
  const n=dv.getUint16(eo+10,true);let pos=dv.getUint32(eo+16,true);const out={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(pos,true)!==0x02014b50)break;
    const method=dv.getUint16(pos+10,true),csize=dv.getUint32(pos+20,true),nl=dv.getUint16(pos+28,true),xl=dv.getUint16(pos+30,true),cl=dv.getUint16(pos+32,true),lo=dv.getUint32(pos+42,true);
    const name=new TextDecoder('utf-8').decode(bytes.subarray(pos+46,pos+46+nl));
    const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),comp=bytes.slice(ds,ds+csize);
    if(/^xl\/(sharedStrings\.xml|workbook\.xml|worksheets\/sheet\d+\.xml)$/.test(name)){
      if(method===0)out[name]=comp;
      else if(method===8){
        if(!('DecompressionStream' in window))throw Error('هذا المتصفح لا يستطيع قراءة ملفات Excel المضغوطة. احفظ الملف بصيغة CSV واستورده.');
        const st=new DecompressionStream('deflate-raw'),w=st.writable.getWriter();w.write(comp);w.close();
        out[name]=new Uint8Array(await new Response(st.readable).arrayBuffer());
      }
    }
    pos+=46+nl+xl+cl;
  }
  return out;
}
const xesc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
const colName=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
const XDECL='<'+'?xml version="1.0" encoding="UTF-8" standalone="yes"?'+'>';
const NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
const isoToSerial=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||''));return m?Date.UTC(+m[1],+m[2]-1,+m[3])/864e5+25569:null};
/* يحوّل قيمة تاريخ من Excel (رقم تسلسلي أو نص بعدة صيغ) إلى YYYY-MM-DD */
function toIso(v){
  if(v==null||v==='')return '';
  const s=norm(v);
  if(/^\d+(\.\d+)?$/.test(s)){const n=Number(s);if(n>20000&&n<90000)return new Date(Math.round((n-25569)*864e5)).toISOString().slice(0,10)}

  m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/.exec(s);if(m)return m[3]+'-'+pad(m[2])+'-'+pad(m[1]);
  return '';
}
const excelFields=()=>cfg.fields.filter(f=>f.visible!==false||f.locked);
function fieldList(f){

  if(f.type==='priority')return cfg.priorities;

}
function sheetXml(rows,cols,validations){

    if(c==null||c.v===''||c.v==null)return '';
    const ref=colName(ci)+(ri+1),st=c.s?' s="'+c.s+'"':'';
    return c.n?'<c r="'+ref+'"'+st+'><v>'+c.v+'</v></c>':'<c r="'+ref+'"'+st+' t="inlineStr"><is><t xml:space="preserve">'+xesc(c.v)+'</t></is></c>';
  }).join('')+'</row>').join('');
  const dv=(validations||[]).filter(v=>v.list&&v.list.length&&v.list.join(',').length<=250);

    '<cols>'+cols.map((c,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+c.w+'" customWidth="1"'+(c.s?' style="'+c.s+'"':'')+'/>').join('')+'</cols>'+
    '<sheetData>'+body+'</sheetData>'+
    (dv.length?'<dataValidations count="'+dv.length+'">'+dv.map(v=>'<dataValidation type="list" allowBlank="1" showErrorMessage="0" sqref="'+v.col+'2:'+v.col+'5000"><formula1>"'+xesc(v.list.join(','))+'"</formula1></dataValidation>').join('')+'</dataValidations>':'')+
    '</worksheet>';
}

  const styles=XDECL+'<'+'styleSheet xmlns="'+NS+'"><numFmts count="1"><numFmt numFmtId="164" formatCode="yyyy\\-mm\\-dd"/></numFmts>'+
    '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>'+
    '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF'+String(cfg.theme.navy||'#17324d').replace('#','').toUpperCase()+'"/><bgColor indexed="64"/></patternFill></fill></fills>'+
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
    '<cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="49" fontId="1" fillId="2" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="49" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></'+'styleSheet>';
  const R='http://schemas.openxmlformats.org/officeDocument/2006/relationships',PR='http://schemas.openxmlformats.org/package/2006/relationships';
  return zipStore([
    {name:'[Content_Types].xml',text:XDECL+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
    {name:'_rels/.rels',text:XDECL+'<Relationships xmlns="'+PR+'"><Relationship Id="rId1" Type="'+R+'/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml',text:XDECL+'<workbook xmlns="'+NS+'" xmlns:r="'+R+'"><bookViews><workbookView/></bookViews><sheets><sheet name="المعاملات" sheetId="1" r:id="rId1"/><sheet name="تعليمات" sheetId="2" r:id="rId2"/></sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels',text:XDECL+'<Relationships xmlns="'+PR+'"><Relationship Id="rId1" Type="'+R+'/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="'+R+'/worksheet" Target="worksheets/sheet2.xml"/><Relationship Id="rId3" Type="'+R+'/styles" Target="styles.xml"/></Relationships>'},

function excelTemplate(withData){

  const a=document.createElement('a'),u=URL.createObjectURL(blob);
  a.href=u;a.download=(withData?'معاملات_للتعديل_':'قالب_المعاملات_')+today()+'.xlsx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);

/* يقرأ أول ورقة من ملف xlsx ويعيدها كصفوف */
async function xlsxRows(buf){
  const files=await zipRead(buf),dec=new TextDecoder('utf-8'),parse=b=>new DOMParser().parseFromString(dec.decode(b),'application/xml');
  const sheetName=files['xl/worksheets/sheet1.xml']?'xl/worksheets/sheet1.xml':Object.keys(files).filter(k=>/sheet\d+\.xml$/.test(k)).sort()[0];
  if(!sheetName)throw Error('لم أجد ورقة بيانات داخل الملف');
  const shared=[];
  if(files['xl/sharedStrings.xml']){
    const sd=parse(files['xl/sharedStrings.xml']);
    [...sd.getElementsByTagName('si')].forEach(si=>{shared.push([...si.getElementsByTagName('t')].filter(t=>t.parentNode.nodeName!=='rPh').map(t=>t.textContent).join(''))});
  }
  const doc=parse(files[sheetName]),rows=[];
  [...doc.getElementsByTagName('row')].forEach(row=>{
    const r=[];
    [...row.getElementsByTagName('c')].forEach((c,idx)=>{
      const ref=c.getAttribute('r')||'';let ci=idx;
      const m=/^([A-Z]+)/.exec(ref);if(m){ci=0;for(const ch of m[1])ci=ci*26+(ch.charCodeAt(0)-64);ci--}
      const t=c.getAttribute('t'),vEl=c.getElementsByTagName('v')[0];let v='';
      if(t==='inlineStr')v=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');
      else if(vEl){v=vEl.textContent;if(t==='s')v=shared[+v]??'';else if(t==='b')v=v==='1'?'نعم':'لا'}
      r[ci]=v;
    });
    const ri=(+row.getAttribute('r')||rows.length+1)-1;rows[ri]=r;
  });
  return rows.map(r=>r||[]);
}
function csvRows(text){
  text=text.replace(/^﻿/,'');const rows=[];let row=[],cur='',q=false;
  const delim=(text.split('\n')[0].split(';').length>text.split('\n')[0].split(',').length)?';':',';
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(cur);cur=''}
    else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur=''}
    else if(ch!=='\r')cur+=ch;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows;
}
function ensureStatusName(v){
  if(st(v))return v;
  const pal=['#2d6ea3','#6653a5','#a86f18','#c05b20','#28784f','#8a4b7a','#3f7f8c','#7a6a2a'];
  cfg.statuses.push({id:uid('s_'),name:v,color:pal[cfg.statuses.length%pal.length],role:''});return v;
}
function parseImport(rows){
  const filled=r=>r&&r.some(c=>String(c??'').trim()!=='');
  const hi=rows.findIndex(filled);if(hi<0)throw Error('الملف فارغ');
  const clean=s=>norm(String(s??'').replace(/\*/g,'').replace(/\(.*?\)/g,''));
  const by={};cfg.fields.forEach(f=>{by[clean(f.label)]=f;by[clean(f.id)]=f});
  const map=[];for(let i=0;i<rows[hi].length;i++)map[i]=by[clean(rows[hi][i])]||null;
  if(!map.some(f=>f&&f.id==='number'))throw Error('لم أجد عمود "'+fieldLabel('number')+'". استخدم القالب الذي ينزّله النظام ولا تغيّر صف العناوين.');
  const items=new Map();let skipped=0,repeated=0;
  rows.slice(hi+1).forEach(r=>{
    if(!filled(r))return;const o={};
    map.forEach((f,i)=>{if(!f)return;const raw=r[i]==null?'':r[i];
      o[f.id]=f.type==='date'?toIso(raw):f.type==='checkbox'?(String(raw).trim()===''?'':/^(نعم|yes|true|1|✓)$/i.test(String(raw).trim())):String(raw).trim()});
    const k=numKey(o.number);
    if(!k){skipped++;return}
    o.number=String(o.number).trim().replace(/\.0+$/,'');
    if(items.has(k)){repeated++;items.set(k,Object.assign(items.get(k),Object.fromEntries(Object.entries(o).filter(e=>e[1]!==''))))}
    else items.set(k,o);
  });
  return {items:[...items.values()],skipped,repeated,unknown:rows[hi].filter((h,i)=>!map[i]&&String(h??'').trim()!=='')};
}
/* الاستيراد: يحدّث الموجود بنفس الرقم، يضيف الجديد، ولا يحذف شيئًا. يعيد دالة تراجع. */
function applyImport(items){
  let add=0,upd=0,bad=0;const before=new Map(),added=[];
  const byNum=new Map();transactions.forEach(t=>{const k=numKey(t.number);if(k&&!byNum.has(k))byNum.set(k,t)});
  items.forEach((o,i)=>{
    const k=numKey(o.number);let t=byNum.get(k);const isNew=!t;
    if(isNew){
      if(!o.subject){bad++;return}
      /* معرّف ثابت مشتق من الرقم: لو استورد جهازان الملف نفسه تندمج المعاملتان عند المزامنة ولا تتكرران */
      let id='n_'+k;if(transactions.some(x=>x.id===id))id=uid('t');
      t={id,created:Date.now()+i,history:[],customFields:{},number:o.number,type:cfg.types[0]||'',topic:'',subject:'',party:'',department:cfg.brand.org,owner:ownerOn()?myEmp():'',received:today(),priority:cfg.priorities[0]||'',status:defStatus(),reminderDate:'',reminderOwner:'',notes:''};
      delete tomb[id];transactions.unshift(t);byNum.set(k,t);added.push(id);add++;
    }else{before.set(t.id,clone(t));upd++}
    const prev=t.status;
    Object.keys(o).forEach(id=>{
      const f=fieldOf(id);let v=o[id];if(!f||v===''||(id==='number'&&!isNew))return;
      if(f.type==='status')v=ensureStatusName(v);
      else if(f.type==='type'){if(!cfg.types.includes(v))cfg.types.push(v)}
      else if(f.type==='priority'){if(!cfg.priorities.includes(v))cfg.priorities.push(v)}
      else if((f.type==='combo'||f.type==='select')&&cfg.lists[f.list]){if(!cfg.lists[f.list].items.includes(v))cfg.lists[f.list].items.push(v)}
      if(f.builtin)t[id]=v;else t.customFields[id]=v;
    });
    if(!t.topic)t.topic=nextTopic();
    applyStatusEffects(t,prev,isNew);
  });
  const undo=()=>{
    const now=Date.now();
    transactions=transactions.filter(t=>{if(added.includes(t.id)){tomb[t.id]=now;return false}return true});
    transactions=transactions.map(t=>before.has(t.id)?Object.assign(before.get(t.id),{rev:now}):t);
    persistTx();refresh();toast('تم التراجع عن الاستيراد');
  };
  return {add,upd,bad,undo};
}
function handleExcelImport(file){
  if(!file)return;
  if(!(canAdd()&&P().edit==='all'))return toast(T('viewer'));
  const isCsv=/\.csv$/i.test(file.name);
  const rd=new FileReader();
  rd.onerror=()=>toast('تعذر قراءة الملف');
  rd.onload=async()=>{
    try{
      const rows=isCsv?csvRows(String(rd.result)):await xlsxRows(rd.result);
      const p=parseImport(rows);
      if(!p.items.length)return toast('لم أجد صفوفًا معبأة في الملف');
      const keys=new Set(transactions.map(t=>numKey(t.number)));const exists=o=>keys.has(numKey(o.number));
      const nNew=p.items.filter(o=>!exists(o)&&o.subject).length,nUpd=p.items.filter(exists).length;
      if(!nNew&&!nUpd)return toast('الصفوف الجديدة ينقصها الموضوع، فلم يُستورد شيء');
      if(!confirm('سيتم إضافة '+nNew+' معاملة جديدة وتحديث '+nUpd+' معاملة موجودة بنفس الرقم.'+(p.unknown.length?'\nأعمدة غير معروفة سيتم تجاهلها: '+p.unknown.join('، '):'')+'\nمتابعة؟'))return;
      const total0=transactions.length;
      const r=applyImport(p.items);
      persistTx();persistCfg();
      toast('تم الاستيراد: '+r.add+' جديدة، '+r.upd+' محدّثة'+((r.bad+p.skipped)?'، وتم تجاهل '+(r.bad+p.skipped)+' صف ناقص (بدون رقم أو موضوع)':'')+(p.repeated?'، ودُمج '+p.repeated+' صف مكرر الرقم داخل الملف':'')+' — الإجمالي '+total0+' ← '+transactions.length,T('btn.undo'),r.undo,20000);
    }catch(err){console.error(err);toast('تعذر الاستيراد: '+err.message)}
  };
  if(isCsv)rd.readAsText(file);else rd.readAsArrayBuffer(file);
}

const isListType=t=>t==='select'||t==='combo';
const listArr=key=>(key==='types'||key==='priorities')?cfg[key]:((cfg.lists[key]||{}).items||[]);
const listFieldIds=key=>key==='types'?['type']:key==='priorities'?['priority']:cfg.fields.filter(f=>f.list===key).map(f=>f.id);
const listUse=(key,x)=>{const fs=listFieldIds(key).map(fieldOf).filter(Boolean);return transactions.filter(t=>fs.some(f=>getVal(t,f)===x)).length};
const sh=(title,desc,right)=>`<div class="panel-head"><div><h2>${esc(title)}</h2>${desc?`<p>${esc(desc)}</p>`:''}</div>${right||''}</div>`;
const mb=(act,id,txt,cls,title)=>`<button class="mini ${cls||''}" data-act="${act}" data-id="${esc(id)}"${title?` title="${esc(title)}"`:''}>${txt}</button>`;
const rowItem=o=>`<div class="rowitem${o.off?' off':''}">${o.lead||''}<div class="grow"><strong>${esc(o.title)}</strong>${o.sub?`<small>${o.sub}</small>`:''}</div>${o.btns||''}</div>`;
const moveBtns=(p,id)=>mb(p+'-up',id,'↑','','أعلى')+mb(p+'-down',id,'↓','','أسفل');
function moveItem(arr,id,dir,same){
  const i=arr.findIndex(x=>x.id===id);if(i<0)return;
  let j=i+dir;while(j>=0&&j<arr.length&&same&&!same(arr[i],arr[j]))j+=dir;
  if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];
}
function setPath(o,path,v){const k=path.split('.');let c=o;for(let i=0;i<k.length-1;i++)c=c[k[i]]=c[k[i]]||{};c[k[k.length-1]]=v}
const statusOpts=()=>cfg.statuses.map(s=>[s.id,s.name]);
const usedCount=name=>transactions.filter(t=>t.status===name).length;

function renderSettings(){
  if(!settingsAllowed()){host().innerHTML=`<div class="panel"><div class="empty">${esc(T('noaccess'))}</div></div>`;return}
  const tabs=TABS.filter(t=>t[0]!=='users'||isAdmin());if(!tabs.some(t=>t[0]===UI.tab))UI.tab='general';
  host().innerHTML=`<div class="tabs">${tabs.map(([k,n])=>`<button class="tab${UI.tab===k?' active':''}" data-act="tab" data-tab="${k}">${n}</button>`).join('')}</div><div class="panel" id="tabBody"></div>`;
  const fn={general:tabGeneral,pages:tabPages,dashboard:tabDashboard,fields:tabFields,lists:tabLists,texts:tabTexts,theme:tabTheme,users:tabUsers,export:tabExport,sync:tabSync}[UI.tab]||tabGeneral;
  $('#tabBody').innerHTML=fn();
  if(UI.tab==='sync'){renderSyncUi();renderFileUi()}
}
const inp=(path,label,extra)=>`<div class="field"><label>${esc(label)}</label><input data-cfg="${path}" value="${esc(path.split('.').reduce((o,k)=>o&&o[k],cfg))}" ${extra||''}></div>`;

    {k:'exports',label:'إظهار أزرار التصدير (CSV / Excel / Word / PDF)',type:'check'});

function editPage(id){
  const p=id?page(id):null;
  const vals=p?{...p,statuses:(p.filter||{}).statuses||[],types:(p.filter||{}).types||[],owners:(p.filter||{}).owners||[],priorities:(p.filter||{}).priorities||[],dueOnly:!!(p.filter||{}).dueOnly,followOnly:!!(p.filter||{}).followOnly,addBtn:p.addBtn!==false,exports:!!p.exports,toolbar:p.toolbar||'basic',columns:p.columns||[]}
    :{title:'',desc:'',icon:'●',group:cfg.navGroups[0].id,addBtn:false,addText:'',note:'',statuses:[],types:[],owners:[],priorities:[],dueOnly:false,followOnly:false,columns:['number','subject','employee','status'],toolbar:'basic',exports:false};
  openEditor({title:p?'تعديل الصفحة':'صفحة جديدة',fields:pageFields(p),values:vals,
    onSave:v=>{
      const q=p||{id:uid('pg_'),kind:'list',builtin:false,visible:true};
      Object.assign(q,{title:v.title,desc:v.desc,icon:v.icon||'•',group:v.group});
      if(q.kind!=='settings'){q.addBtn=v.addBtn;q.addText=v.addText}
      if(q.kind==='list'){
        q.note=v.note;q.toolbar=v.toolbar;q.exports=v.exports;
        q.filter={statuses:v.statuses,types:v.types,owners:v.owners,priorities:v.priorities,dueOnly:v.dueOnly,followOnly:v.followOnly};
        const order=allCols().map(c=>c[0]);q.columns=order.filter(c=>v.columns.includes(c));
      }
      if(!p){cfg.pages.push(q);UI.page=q.id}
      persistCfg();
    },
    onDelete:(p&&p.kind!=='dashboard'&&p.kind!=='settings')?()=>{delPage(p.id)}:null});
}
function delPage(id){
  const p=page(id);if(!p||p.kind==='dashboard'||p.kind==='settings')return false;
  if(!confirm('حذف صفحة "'+p.title+'"؟ (المعاملات نفسها لن تتأثر)'))return false;
  cfg.pages=cfg.pages.filter(x=>x.id!==id);
  cfg.widgets.forEach(w=>{if(w.link===id)w.link=''});
  if(UI.page===id)UI.page='dashboard';
  persistCfg();
}

/* ---- الحقول والأقسام ---- */
function tabFields(){
  let h=sh('الأقسام','الأقسام تجمع الحقول في نموذج المعاملة تحت عناوين.',`<button class="btn primary" data-act="sec-add">+ قسم جديد</button>`)+'<div class="rowlist">';
  h+=cfg.sections.map(s=>rowItem({off:s.visible===false,title:s.title,sub:cfg.fields.filter(f=>f.section===s.id).length+' حقل',btns:moveBtns('sec',s.id)+mb('sec-vis',s.id,s.visible===false?'إظهار':'إخفاء')+mb('sec-edit',s.id,'تسمية')+(cfg.sections.length>1?mb('sec-del',s.id,'حذف','danger'):'')})).join('')+'</div>';
  h+=`<hr class="sep">`+sh('الحقول','تحكم بأسماء الحقول وإظهارها وإلزاميتها وأقسامها. الحقول المخصصة تظهر في النموذج والتفاصيل والتصدير وأعمدة الجداول.',`<button class="btn primary" data-act="fd-add">+ حقل جديد</button>`)+'<div class="rowlist">';
  h+=cfg.fields.map(f=>{const sec=cfg.sections.find(s=>s.id===f.section);const tags=[(FIELD_TYPES.find(t=>t[0]===f.type)||[0,{type:'قائمة الأنواع',priority:'قائمة الأولويات',status:'قائمة الحالات'}[f.type]||f.type])[1]+(isListType(f.type)&&cfg.lists[f.list]?' ('+cfg.lists[f.list].title+')':''),sec?sec.title:'',f.required?'إلزامي':'',f.builtin?'أساسي':'مخصص'].filter(Boolean);
    return rowItem({off:f.visible===false,title:f.label,sub:esc(tags.join(' · ')),btns:moveBtns('fd',f.id)+(f.locked?'':mb('fd-vis',f.id,f.visible===false?'إظهار':'إخفاء'))+mb('fd-edit',f.id,'تعديل')+(f.builtin?'':mb('fd-del',f.id,'حذف','danger'))})}).join('')+'</div>';
  h+=`<div class="form-actions"><button class="btn secondary" data-act="fd-restore">استعادة الحقول الأساسية الناقصة</button></div>`;
  return h;
}
function editField(id){
  const f=id?fieldOf(id):null;
  const flex=!!f&&f.builtin&&['party','department','owner','employee','reminderOwner'].includes(f.id);
  const canType=!f||!f.builtin, hasList=canType||flex;
  const fl=[{k:'label',label:'اسم الحقل',req:true}];
  if(canType)fl.push({k:'type',label:'نوع الحقل',type:'select',opts:FIELD_TYPES});
  else if(flex)fl.push({k:'type',label:'طريقة الإدخال',type:'select',opts:[['combo','اختيار من القائمة أو كتابة قيمة جديدة تُحفظ'],['select','اختيار من القائمة فقط'],['text','كتابة حرة بدون قائمة']]});
  if(hasList)fl.push({k:'list',label:'القائمة المرتبطة (لحقول القوائم)',type:'select',opts:[['','قائمة جديدة خاصة بهذا الحقل'],...Object.keys(cfg.lists).map(k=>[k,cfg.lists[k].title])]},
    {k:'options',label:'عناصر القائمة (سطر لكل عنصر)',type:'textarea',help:'تُطبَّق على القائمة المرتبطة الحالية. يمكنك أيضًا تعديل العناصر من تبويب "الحالات والقوائم".'});
  fl.push({k:'section',label:'القسم',type:'select',opts:cfg.sections.map(s=>[s.id,s.title])});
  if(!f||!f.locked)fl.push({k:'required',label:'حقل إلزامي',type:'check'},{k:'visible',label:'ظاهر في النموذج',type:'check'});
  fl.push({k:'full',label:'يأخذ عرض السطر كاملًا',type:'check'},{k:'ph',label:'نص إرشادي داخل الحقل'},{k:'help',label:'ملاحظة صغيرة تحت الحقل'},{k:'showWhen',label:'متى يظهر؟',type:'select',opts:[['','دائمًا'],['reminder','عند اختيار حالة التذكير فقط']]});
  const curList=(f&&f.list)||'';
  const vals=f?{...f,list:curList,options:listItems(f).join('\n'),showWhen:f.showWhen||''}:{label:'',type:'text',list:'',options:'',section:cfg.sections[0].id,required:false,visible:true,full:false,ph:'',help:'',showWhen:''};
  openEditor({title:f?'تعديل الحقل':'حقل جديد',fields:fl,values:vals,onSave:v=>{
    if(cfg.fields.some(x=>x.id!==(f&&f.id)&&x.label===v.label)){toast('يوجد حقل بنفس الاسم');return false}
    const q=f||{id:uid('cf_'),builtin:false,visible:true};
    const type=(canType||flex)?v.type:q.type;
    if(hasList&&isListType(type)){
      const items=String(v.options||'').split('\n').map(x=>x.trim()).filter(Boolean);
      let key=v.list;
      if(!key){key='l_'+q.id;if(!cfg.lists[key])cfg.lists[key]={title:v.label,items:[]}}
      /* عناصر الصندوق تخص القائمة التي كانت معروضة؛ إذا بدّل القائمة لأخرى موجودة لا نكتب فوقها */
      if(key===curList||!v.list)cfg.lists[key].items=[...new Set(items)];
      if(type==='select'&&!cfg.lists[key].items.length){toast('أضف عنصرًا واحدًا على الأقل للقائمة');return false}
      q.list=key;
    }else if(canType||flex)delete q.list;
    q.type=type;q.label=v.label;q.section=v.section;q.full=!!v.full;q.ph=v.ph;q.help=v.help;q.showWhen=v.showWhen||'';
    if(!q.locked){q.required=!!v.required;q.visible=v.visible!==false}
    if(!f)cfg.fields.push(q);persistCfg();
  },onDelete:(f&&!f.builtin)?()=>delField(f.id):null});
}
function delField(id){
  const f=fieldOf(id);if(!f||f.builtin)return false;
  if(!confirm('حذف الحقل "'+f.label+'"؟ تبقى القيم المسجلة في المعاملات لكنها لن تظهر.'))return false;
  cfg.fields=cfg.fields.filter(x=>x.id!==id);
  cfg.export.columns=cfg.export.columns.filter(c=>c!==id);
  cfg.pages.forEach(p=>{if(p.columns)p.columns=p.columns.filter(c=>c!==id)});
  cfg.widgets.forEach(w=>{if(w.columns)w.columns=w.columns.filter(c=>c!==id)});
  persistCfg();
}

function simpleList(key,title,desc,extra){
  const arr=listArr(key);

    const old=s&&s.name;const q=s||{id:uid('s_')};
    q.name=v.name;q.color=v.color;q.role=v.role;if(v.dept)q.dept=v.dept;else delete q.dept;

function delStatus(id){
  const s=cfg.statuses.find(x=>x.id===id);if(!s||cfg.statuses.length<2)return;
  const n=usedCount(s.name);
  const finish=target=>{
    if(target){transactions.forEach(t=>{if(t.status===s.name){t.status=target;t.history.push([today(),target,me().name]);t.rev=Date.now();if(stRole(t)==='closed')t.closed=t.closed||today();else t.closed=null}});persistTx()}
    cfg.statuses=cfg.statuses.filter(x=>x.id!==id);
    cfg.pages.forEach(p=>{if(p.filter&&p.filter.statuses)p.filter.statuses=p.filter.statuses.filter(x=>x!==id)});
    cfg.widgets.forEach(w=>{if(w.statuses)w.statuses=w.statuses.filter(x=>x!==id)});
    if(!cfg.statuses.some(x=>x.role==='new'))cfg.statuses[0].role='new';
    persistCfg();
  };
  if(!n){if(confirm('حذف الحالة "'+s.name+'"؟'))finish(null);return}
  openEditor({title:'حذف الحالة "'+s.name+'"',intro:'يوجد '+n+' معاملة بهذه الحالة. اختر الحالة التي ستنتقل إليها.',fields:[{k:'to',label:'نقل المعاملات إلى',type:'select',opts:cfg.statuses.filter(x=>x.id!==id).map(x=>[x.name,x.name])}],values:{},saveText:'نقل وحذف',onSave:v=>{finish(v.to)}});
}
function listRename(key,old,nw){
  const fs=listFieldIds(key).map(fieldOf).filter(Boolean);
  transactions.forEach(t=>{let ch=false;fs.forEach(f=>{if(getVal(t,f)===old){if(f.builtin)t[f.id]=nw;else t.customFields[f.id]=nw;ch=true}});if(ch)t.rev=Date.now()});
  cfg.pages.forEach(p=>{const fl=p.filter||{};const k=key==='types'?'types':key==='priorities'?'priorities':key==='employees'?'owners':'';if(k&&Array.isArray(fl[k]))fl[k]=fl[k].map(x=>x===old?nw:x)});
  cfg.users.forEach(u=>{if(key==='employees'&&u.employee===old)u.employee=nw});
  persistTx();
}

let dirty=false,syncing=false,again=false,pushTimer=null,pollTimer=null,syncState='off',syncMsg='',pendingRender=false;
function setSync(state,msg){syncState=state;syncMsg=msg||'';renderSyncUi()}
/* التعديلات التي لم تصل للسحابة بعد: مقارنة كل سجل بآخر نسخة رُفعت بنجاح (تُحفظ على الجهاز) */
const KEY_SYNCED='unified_synced_v1';
let synced=jparse(store.getItem(KEY_SYNCED),null);
const revMap=()=>{const m={};transactions.forEach(t=>{if(!t.demo)m[t.id]=t.rev||0});return m};
function pendingCount(){
  if(!L.url||!synced)return 0;
  let n=0;const seen=new Set();
  transactions.forEach(t=>{if(t.demo)return;seen.add(t.id);if(synced[t.id]!==(t.rev||0))n++});
  Object.keys(synced).forEach(id=>{if(!seen.has(id))n++});
  return n;
}
function markSynced(m){synced=m;try{store.setItem(KEY_SYNCED,JSON.stringify(m))}catch(e){}}
function renderSyncUi(){
  const map={off:['',T('sync.off')],ok:['ok',T('sync.ok')],bad:['bad',T('sync.bad')],wait:['wait',T('sync.wait')]};
  const s=L.url?(syncState==='off'?'wait':syncState):'off';
  const [cls,txt]=map[s]||map.off;
  const pn=s==='off'?0:pendingCount();
  const text=pn?('⏳ '+pn+' '+(pn===1?'تعديل':'تعديلات')+' بانتظار الرفع'):(txt+(syncMsg&&s!=='off'?' — '+syncMsg:''));
  const tip=pn?(text+' — محفوظة على هذا الجهاز وتُرفع تلقائيًا عند عودة الاتصال'+(s==='bad'&&syncMsg?' ('+syncMsg+')':'')):text;
  [['#syncDot','#syncText'],['#syncDot2','#syncText2']].forEach(([d,t],i)=>{const de=$(d),te=$(t);if(de)de.className='dot '+(pn?(s==='bad'?'bad':'wait'):cls);if(te){te.textContent=i&&pn?tip:text;te.title=tip}});
}
const bundle=()=>({app:APP_TAG,transactions,tomb,config:cfg,savedAt:new Date().toISOString()});
/* المصادقة: جلسة دخول (من رابط Google) إن وُجدت، وإلا رمز التخزين */
async function cloudGet(){
  const sep=L.url.includes('?')?'&':'?';
  const auth=L.sess?('sess='+encodeURIComponent(L.sess)):('token='+encodeURIComponent(L.token));
  const r=await fetch(L.url+sep+auth,{cache:'no-store'});
  if(!r.ok)throw Error('http_'+r.status);
  const j=await r.json();if(j&&j.error)throw Error(j.error);return j||{};
}
async function cloudPost(b){
  const body=L.sess?{sess:L.sess,data:b}:{token:L.token,data:b};
  const r=await fetch(L.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  if(!r.ok)throw Error('http_'+r.status);
  const j=await r.json();if(j&&j.error)throw Error(j.error);return j;
}
function errMsg(e){
  const m=(e&&e.message)||'';
  if(m==='unauthorized')return 'الرمز السري غير صحيح';
  if(m==='busy')return 'الخدمة مزدحمة لحظيًا، ستُعاد المحاولة';
  if(m==='foreign')return 'هذا الرابط يحفظ بيانات نظام آخر — أنشئ رابط تخزين خاصًا بهذا النظام';
  if(m==='http_404')return 'رابط التخزين لم يُعثر عليه (404) — تُعاد المحاولة تلقائيًا. إن استمر: افتح النموذج بحساب قوقل واحد، وتأكد أن آخر نشر تم بالقلم ✏️ ← نسخة جديدة';
  if(m.indexOf('http_')===0)return 'الخدمة ردّت بخطأ ('+m.slice(5)+') — تأكد أن الرابط من نوع "تطبيق ويب" وينتهي بـ /exec';
  return navigator.onLine===false?'لا يوجد اتصال بالإنترنت — التعديلات محفوظة وستُرفع عند عودة الاتصال':'انقطاع مؤقت — تُعاد المحاولة تلقائيًا، وتعديلاتك محفوظة';
}
const isForeign=r=>!!r&&typeof r==='object'&&((r.app&&r.app!==APP_TAG)||(!r.app&&('incomingItems' in r||'followups' in r||'kpiItems' in r||'fuSettings' in r)));
const sig=list=>list.map(t=>t.id+':'+(t.rev||0)).sort().join('|');
function mergeRemote(r){
  const rT=Array.isArray(r.transactions)?r.transactions.map((t,i)=>normTx(t,i)):[];
  const rTomb=(r.tomb&&typeof r.tomb==='object')?r.tomb:{};
  const beforeSig=sig(transactions),beforeTomb=Object.keys(tomb).length;
  const nt={...tomb};Object.keys(rTomb).forEach(k=>{nt[k]=Math.max(nt[k]||0,rTomb[k])});
  const limit=Date.now()-120*864e5;Object.keys(nt).forEach(k=>{if(nt[k]<limit)delete nt[k]});
  const map=new Map();
  [...transactions,...rT].forEach(t=>{const c=map.get(t.id);if(!c||(t.rev||0)>(c.rev||0))map.set(t.id,t)});
  const out=[];map.forEach((t,id)=>{if(nt[id]&&nt[id]>=(t.rev||0))return;out.push(t)});
  const seen=new Map(),drop=new Set();
  out.forEach(t=>{const k=numKey(t.number);if(!k)return;const o=seen.get(k);if(!o){seen.set(k,t);return}
    const older=(t.rev||0)>(o.rev||0)?o:t;drop.add(older.id);nt[older.id]=Date.now();if(older===o)seen.set(k,t)});
  if(drop.size)for(let i=out.length-1;i>=0;i--)if(drop.has(out[i].id))out.splice(i,1);
  out.sort((a,b)=>(b.created||0)-(a.created||0));
  let cfgChanged=false;const rRev=(r.config&&r.config.v===2&&r.config.rev)||0;
  if(r.config&&r.config.v===2&&rRev>(cfg.rev||0)){cfg=normalizeCfg(r.config);cfgChanged=true}
  transactions=out;tomb=nt;
  const mv=migrateOwner();
  return {
    localChanged:!!mv||cfgChanged||sig(out)!==beforeSig||Object.keys(nt).length!==beforeTomb,
    needPush:!!mv||!r.app||sig(out)!==sig(rT)||(cfg.rev||0)>rRev||Object.keys(nt).length!==Object.keys(rTomb).length
  };
}
function storeLocal(){try{store.setItem(KEY_TX,JSON.stringify(transactions));store.setItem(KEY_TOMB,JSON.stringify(tomb));store.setItem(KEY_CFG,JSON.stringify(cfg))}catch(e){}applyTheme();scheduleFileWrite()}
function softRefresh(){
  const ae=document.activeElement;
  const typing=ae&&host().contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName);
  if(anyModal()||typing){pendingRender=true;const p=page(UI.page);if(!anyModal()&&p&&p.kind==='list')fillTable(p);return}
  refresh();
}
async function syncNow(manual){
  if(!L.url)return;
  if(syncing){again=true;return}
  syncing=true;setSync('wait');let snap=null;
  try{
    do{
      again=false;
      const r=await cloudGet();
      if(isForeign(r))throw Error('foreign');
      const res=mergeRemote(r);
      if(res.localChanged){storeLocal();softRefresh()}
      snap=revMap();
      if(res.needPush||dirty){dirty=false;try{await cloudPost(bundle())}catch(e){dirty=true;throw e}}
    }while(again);
    setSync('ok','آخر مزامنة '+new Date().toLocaleTimeString('ar-SA-u-nu-latn',{hour:'2-digit',minute:'2-digit'}));
    if(manual)toast('تمت المزامنة');
    if(snap)markSynced(snap);renderSyncUi();
    retryN=0;clearTimeout(retryTimer);
  }catch(e){
    setSync('bad',errMsg(e));if(manual)toast(errMsg(e));
    /* انقطاع مؤقت: إعادة محاولة تلقائية متدرجة (5ث ثم 15ث ثم 30ث) — التعديلات تبقى محفوظة على الجهاز حتى تُرفع */
    const m=(e&&e.message)||'';
    if(m!=='unauthorized'&&m!=='foreign'&&retryN<6){clearTimeout(retryTimer);retryTimer=setTimeout(()=>syncNow(false),[5,15,30][Math.min(retryN,2)]*1000);retryN++}
    /* انتهت جلسة الدخول: نطلب الدخول من جديد */
    if(L.sess&&e&&e.message==='unauthorized'){L.sess='';saveLocal();stopPolling();if(HOSTED)setTimeout(hostedStart,50)}
  }
  finally{syncing=false}
}

async function linkCloud(url,token){
  url=normUrl(url);token=(token||'').trim();

  if(i>-1){try{token=decodeURIComponent(url.slice(i+3))}catch(e){token=url.slice(i+3)}url=url.slice(0,i)}

  if(/\/macros\/library\//.test(url))return toast('هذا رابط "مكتبة" وليس "تطبيق ويب" — استخدم الرابط المنتهي بـ /exec');

  }catch(e){L.url=prev.url;L.token=prev.token;setSync(prev.url?'bad':'off',errMsg(e));toast(errMsg(e))}
}

function legacyParts(x){

    inc:Array.isArray(x&&x.incomingItems)?x.incomingItems:[],

/* تحويل نسخة قديمة (النسخة السابقة من هذا النظام أو نظام المراجعة والعرض) مع الحفاظ على الحالات والحقول الإضافية والموظفين */
function convertLegacy(x){
  const {tx:oldTx,inc:oldInc,fu:oldFu}=legacyParts(x);
  const palette=['#2d6ea3','#6653a5','#a86f18','#c05b20','#28784f','#8a4b7a','#3f7f8c','#7a6a2a'];
  const syn={'قيد العمل':'جاري العمل','تحت الاجراء':'جاري العمل','تحت الإجراء':'جاري العمل','قيد المعالجة':'جاري العمل','قيد المراجعة':'المراجعة','في ملف العرض':'العرض','في العرض':'العرض','تم التسليم':'الصادر','تم التصدير':'الصادر','صادرة':'الصادر','صادر':'الصادر','تحتاج تذكير':'الصادر','للحفظ':'مكتملة','مغلقة':'مكتملة','مكتمل':'مكتملة'};
  const mapSt=v=>{
    v=String(v||'').trim();if(!v)return defStatus();
    if(st(v))return v;
    if(syn[v]&&st(syn[v]))return syn[v];
    cfg.statuses.push({id:uid('s_'),name:v,color:palette[cfg.statuses.length%palette.length],role:''});return v;
  };
  const extra=[['cf_classification','التصنيف','text','classification'],['cf_start','تاريخ البدء','date','start'],['cf_deliver','تاريخ التسليم','date','deliver'],['cf_referral','جهة الإحالة','text','referral'],['cf_linked','المعاملة المرتبطة','text','linkedTxnId']];
  const ensureField=(id,label,type)=>{
    if(fieldOf(id))return;
    if(!cfg.sections.some(s=>s.id==='sec_legacy'))cfg.sections.splice(Math.max(1,cfg.sections.length-1),0,{id:'sec_legacy',title:'بيانات إضافية',visible:true});
    cfg.fields.push({id,label,type,section:'sec_legacy',builtin:false,visible:true});
  };
  const ensureUser=n=>{n=String(n||'').trim();const l=cfg.lists.employees;if(n&&l&&!l.items.includes(n))l.items.push(n)};
  const ensureDept=n=>{n=String(n||'').trim();const l=cfg.lists.departments;if(n&&l&&!l.items.includes(n))l.items.push(n)};
  const make=(t,i,src)=>{
    const n=String(t.number??t.serial??t.ref??t.id??(i+1));
    const date=String(t.received||t.date||t.addedAt||today()).slice(0,10);
    const s=mapSt(t.status);const closedRole=(st(s)||{}).role==='closed';
    const owner=t.owner||t.employee||'';ensureUser(owner);ensureDept(t.department);
    const cf=Object.assign({},t.customFields||{});
    extra.forEach(([id,label,type,key])=>{const v=t[key];if(v!=null&&v!==''){ensureField(id,label,type);cf[id]=String(v)}});
    return normTx({id:String(src+'-'+(t.id??i)),number:n,type:t.type||cfg.types[0],topic:t.topic||'موضوع-'+date.slice(0,4)+'-'+n,subject:t.subject||t.notes||'بدون موضوع',party:t.party||t.country||'',department:t.department||cfg.brand.org,owner:ownerOn()?(owner||me().name):'',received:date,priority:cfg.priorities.includes(t.priority)?t.priority:cfg.priorities[0],status:s,reminderDate:t.reminderDate||t.dueDate||'',employee:t.employee||(ownerOn()?'':owner),reminderOwner:t.reminderOwner||owner||'',notes:t.notes||'',updated:String(t.updated||t.updatedAt||t.deliver||date).slice(0,10),closed:closedRole?(t.closed||t.deliver||date):null,history:Array.isArray(t.history)&&t.history.length?t.history:[[date,s,owner||me().name]],customFields:cf},i);
  };
  const isOwn=!Array.isArray(x)&&x&&!('incomingItems' in x)&&!('followups' in x);
  const out=oldTx.map((t,i)=>isOwn?normTx(Object.assign({},t,{status:mapSt(t.status)},(t.followup===undefined&&(t.status==='تحتاج تذكير'||t.reminderDate))?{followup:'عليها متابعة'}:{}),i):make(t,i,'txn'));
  const used=new Set(out.map(t=>String(t.number)));
  oldInc.forEach((t,i)=>{let n=String(t.id??i+1);if(used.has(n))n='وارد-'+n;used.add(n);out.push(make({...t,number:n,subject:t.subject||t.notes||'معاملة واردة',status:''},i,'incoming'))});
  oldFu.forEach((t,i)=>{let n='متابعة-'+String(t.id??i+1);out.push(make({...t,number:n,type:cfg.types.includes('تذكير')?'تذكير':cfg.types[0],date:t.addedAt||today()},i,'followup'))});
  return out;
}
function handleRestore(file){
  if(!file)return;
  const rd=new FileReader();
  rd.onerror=()=>toast('تعذر قراءة الملف');
  rd.onload=()=>{
    try{
      const x=JSON.parse(rd.result);
      const native=x&&x.app===APP_TAG&&Array.isArray(x.transactions);
      const lp=native?null:legacyParts(x);
      const count=native?x.transactions.length:(lp.tx.length+lp.inc.length+lp.fu.length);
      if(!count)return toast('النسخة غير صالحة: لم نجد سجلات قابلة للاستعادة');
      const kpi=(!native&&Array.isArray(x.kpiItems))?x.kpiItems.length:0;
      if(!confirm('سيتم استبدال معاملات هذا الجهاز بـ '+count+' سجل من النسخة'+(native&&x.config?' مع الإعدادات':'')+(kpi?'.\n(تنبيه: '+kpi+' من بنود مؤشرات الأداء في النسخة القديمة لا تُنقل لهذا النظام)':'')+'.\nمتابعة؟'))return;
      if(native&&x.config&&x.config.v===2)cfg=normalizeCfg(x.config);
      const list=native?x.transactions.map((t,i)=>normTx(t,i)):convertLegacy(x);
      const now=Date.now(),keep=new Set(list.map(t=>t.id));
      transactions.forEach(t=>{if(!keep.has(t.id))tomb[t.id]=now});
      list.forEach((t,i)=>{t.rev=now+i;delete tomb[t.id];delete t.demo});
      transactions=list.sort((a,b)=>(b.created||0)-(a.created||0));
      persistTx();persistCfg();toast('تمت استعادة '+list.length+' سجل');
    }catch(err){console.error(err);toast('تعذر قراءة النسخة: '+err.message)}
  };
  rd.readAsText(file);
}

  if(d.tfilter!=null){const q=el.value.trim();$$('.trow').forEach(r=>{r.style.display=(!q||r.dataset.search.includes(q))?'':'none'});return}
  if(el.id==='f_status'||el.id==='f_followup')syncCond();
  if(el.type==='date'&&d.f){const h=el.parentElement.querySelector('[data-dh]');if(h)h.textContent=el.value?fmt(el.value):''}
});
document.addEventListener('change',e=>{
  if(e.target.id==='restoreFile'){handleRestore(e.target.files[0]);e.target.value=''}
  if(e.target.id==='excelFile'){handleExcelImport(e.target.files[0]);e.target.value=''}
  if(e.target.id==='userSel'){
    const u=cfg.users.find(x=>x.name===e.target.value);if(!u)return;
    if(u.pin&&unlocked()!==u.id){e.target.value=L.user;showLogin(false,u.id);return}
    L.user=u.name;L.uid=u.id;saveLocal();if(!u.pin)setUnlocked('');UI.page=firstAllowed();refresh();
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&anyModal())closeModals()});
$('#txForm').addEventListener('submit',e=>{e.preventDefault();saveForm()});
$('#addBtn').addEventListener('click',()=>openForm());
$('#loginForm').addEventListener('submit',e=>{e.preventDefault();doLogin()});
$('#loginCancel').addEventListener('click',()=>{if(!loginBlocking)hideLogin()});
$('#lockBtn').addEventListener('click',logout);
$('#menuBtn').addEventListener('click',e=>{e.stopPropagation();setMenu(!$('#sidebar').classList.contains('open'))});
/* على الجوال: الضغط خارج القائمة يغلقها */
document.addEventListener('click',e=>{if($('#sidebar').classList.contains('open')&&!e.target.closest('#sidebar,#menuBtn')){setMenu(false);e.preventDefault();e.stopPropagation()}},true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&L.url)syncNow(false)});
window.addEventListener('online',()=>{if(L.url)syncNow(false)});
window.addEventListener('storage',e=>{
  if(e.key!==KEY_TX&&e.key!==KEY_CFG)return;
  transactions=loadTx();cfg=loadCfg();tomb=jparse(store.getItem(KEY_TOMB),{});applyTheme();softRefresh();
});

if(!store.getItem(KEY_CFG)){try{store.setItem(KEY_CFG,JSON.stringify(cfg))}catch(e){}}
const firstVisible=cfg.navGroups.map(g=>cfg.pages.find(p=>p.group===g.id&&p.visible!==false)).find(Boolean);
UI.page=firstVisible?firstVisible.id:'settings';
if(migrateOwner()){try{store.setItem(KEY_TX,JSON.stringify(transactions))}catch(e){}}
applyTheme();renderAll();
if(!store.ok&&!HOSTED)setTimeout(()=>toast('تنبيه: المتصفح يمنع الحفظ على هذا الجهاز. اربط التخزين السحابي حتى لا تضيع البيانات.'),600);
/* قيم موجودة في المعاملات وليست في القوائم تُعرض كخيارات (في الذاكرة فقط) */
cfg.fields.filter(f=>f.type==='combo'&&cfg.lists[f.list]).forEach(f=>{const l=cfg.lists[f.list].items;transactions.forEach(t=>{if(t.demo)return;const v=getVal(t,f);if(v&&!l.includes(v))l.push(v)})});
if(L.url&&(L.token||L.sess)){startPolling();syncNow(false)}
else if(HOSTED)setTimeout(hostedStart,300);
fileReconnect();
})();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
</html>
